<style>
/* CONTAINER */
.container {
    width: 100%;
    max-width: 800px;
    padding: 20px;
}

/* TITLE */
h4 {
    font-size: 24px;
    margin-bottom: 20px;
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(-20px);
    animation: fadeDown 0.8s ease forwards;
}

/* CARD */
.card {
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.3);

    transition: all 0.4s ease;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 0.8s ease forwards;
}

/* delay animasi */
.card:nth-child(2) { animation-delay: 0.2s; }
.card:nth-child(3) { animation-delay: 0.4s; }

/* HOVER EFFECT */
.card:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

/* TITLE CARD */
.card h6 {
    font-size: 18px;
    margin-bottom: 10px;
}

/* TEXT */
.card p {
    font-size: 14px;
    line-height: 1.6;
    opacity: 0.8;
}

/* BUTTON MODERN */
.btn {
    display: inline-block;
    margin-top: 100px;
    padding: 10px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    color: white;

    background: linear-gradient(135deg, #c89b6d, #a97a50);
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);

    transition: all 0.3s ease;
}

/* BUTTON HOVER */
.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* ANIMATIONS */
@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeDown {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
/* =========================
   NAVBAR
========================= */

  font-weight:600;
  transition:0.25s;
}

.nav-links a:hover,
.nav-links a.active{

}

</style>
